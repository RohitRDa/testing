name: Run Unit Tests and Generate Coverage Report

on:
  push:
    branches:
      - main
      - dev
      - Unit_testing_branch
  pull_request:
    branches:
      - main
      - dev
      - Unit_testing_branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # ✅ Fixed this

      - name: Set up Python
        uses: actions/setup-python@v3  # ✅ Fixed this
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install pytest pytest-cov coverage

      - name: Run tests with detailed output
        run: pytest -v --cov=calculator --cov-report=term-missing --cov-fail-under=80

      - name: Generate detailed coverage report
        run: coverage html

      - name: Upload coverage report
        uses: actions/upload-artifact@v3  # ✅ Fixed this
        with:
          name: test-coverage-report
          path: htmlcov
